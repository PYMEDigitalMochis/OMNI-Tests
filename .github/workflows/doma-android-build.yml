name: DOMA v1.8 - compilar APK Android
on:
  push:
    branches: [build/doma-v1.8-android]
    paths:
      - "doma-build/**"
      - ".github/workflows/doma-android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Extract and verify original DOMA Android sources
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode doma-build/doma_v18_android.tar.xz.b64 > /tmp/doma_v18_android.tar.xz
          echo "85eb259454564ebdba427a38587d02aeed120536139d6c8e303490d01583917f  /tmp/doma_v18_android.tar.xz" | sha256sum -c -
          tar -xJf /tmp/doma_v18_android.tar.xz
          test -f android/app/build.gradle
          test -f android/app/src/main/python/portable.py
          test -f android/app/src/main/java/mx/doma/buscador/MainActivity.java
          find android -type f | wc -l
          python3 -m compileall -q android/app/src/main/python

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile DOMA debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../doma-build/build.log

      - name: Verify APK and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > doma-build/apk-metadata.txt
          sha256sum "$APK" > doma-build/app-debug.apk.sha256
          cat doma-build/app-debug.apk.sha256

      - name: Upload compiled APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DOMA-v1.8-Android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            doma-build/app-debug.apk.sha256
            doma-build/apk-metadata.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DOMA-v1.8-build-log
          path: doma-build/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save observable build result on isolated branch
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          BUILD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,datetime,pathlib
          apk=pathlib.Path('android/app/build/outputs/apk/debug/app-debug.apk')
          data={
            'status':os.getenv('JOB_STATUS'),
            'source_commit':os.getenv('BUILD_SHA'),
            'run_id':os.getenv('RUN_ID'),
            'run_attempt':os.getenv('RUN_ATTEMPT'),
            'apk_compiled':apk.is_file() and apk.stat().st_size>0,
            'recorded_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('doma-build/status.json').write_text(json.dumps(data,indent=2)+'\\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doma-build/status.json
          git commit -m "ci: persist DOMA build result [skip ci]" || true
          git push origin HEAD:build/doma-v1.8-android
